name: Update Adyen Specs

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch: # Manual trigger

concurrency:
  group: update-specs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check.outputs.changes }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: priv/ADYEN_OPENAPI_SHA
          sparse-checkout-cone-mode: false

      - name: Compare tracked SHA against adyen-openapi HEAD
        id: check
        run: |
          OLD_SHA=$(cat priv/ADYEN_OPENAPI_SHA 2>/dev/null || echo "")
          NEW_SHA=$(git ls-remote https://github.com/Adyen/adyen-openapi HEAD | cut -f1)

          echo "sha=$NEW_SHA" >> $GITHUB_OUTPUT
          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

  update:
    needs: check
    if: needs.check.outputs.changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync specs into repo
        run: |
          git clone --depth 1 https://github.com/Adyen/adyen-openapi /tmp/adyen-openapi
          rsync -a --delete --exclude='.git' /tmp/adyen-openapi/ priv/specs/
          echo "${{ needs.check.outputs.sha }}" > priv/ADYEN_OPENAPI_SHA

      # Diff our own working tree instead of upstream history: no deep clone,
      # and it also catches drift where priv/specs fell out of sync with the SHA.
      - name: Collect changed services
        id: services
        run: |
          SERVICES=$(git status --porcelain -uall -- priv/specs/json \
            | grep -v '^ *D' \
            | sed -E 's|^...||; s|.*/||; s|\.json$||; s|-v([0-9]+)$|:v\1|' \
            | tr '\n' ' ')
          echo "list=$SERVICES" >> $GITHUB_OUTPUT

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}

      - name: Install Dependencies
        run: mix deps.get

      - name: Regenerate APIs
        if: steps.services.outputs.list != ''
        run: mix adyen.gen ${{ steps.services.outputs.list }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Spec Updates
        run: |
          git add priv/specs priv/ADYEN_OPENAPI_SHA generated_lib
          git diff --cached --quiet \
            || git commit -m "feat(api): update adyen specs and regenerate code"

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v1

      - name: Bump version
        id: bump
        run: |
          CURRENT_VERSION=$(elixir scripts/bump_version.exs --current)
          NEXT_VERSION=$(git-cliff --bump --unreleased | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)

          echo "Current: $CURRENT_VERSION, Next from cliff: $NEXT_VERSION"

          # Only use git-cliff's suggestion if it is strictly higher than current
          # (guards against no-tags case where cliff outputs 0.1.0 regardless of current)
          IS_HIGHER=$(printf '%s\n%s' "$CURRENT_VERSION" "$NEXT_VERSION" | sort -V | tail -n 1)
          if [ -n "$NEXT_VERSION" ] && [ "$IS_HIGHER" = "$NEXT_VERSION" ] && [ "$NEXT_VERSION" != "$CURRENT_VERSION" ]; then
            FINAL_VERSION=$(elixir scripts/bump_version.exs "$NEXT_VERSION")
          else
            FINAL_VERSION=$(elixir scripts/bump_version.exs)
          fi

          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT

      - name: Commit Release
        run: |
          git add mix.exs
          git diff --cached --quiet \
            || git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }}"

      - name: Tag release
        run: git tag "v${{ steps.bump.outputs.version }}"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore: update adyen specs (v${{ steps.bump.outputs.version }})"
          body: |
            This is an automated PR to update Adyen OpenAPI specifications.

            Changes:
            - Synced `priv/specs/` with the latest adyen-openapi commit.
            - Updated `priv/ADYEN_OPENAPI_SHA` to track the synced commit.
            - Regenerated changed API clients in `generated_lib/` via `mix adyen.gen`.
            - Bumped version in `mix.exs` using `git-cliff`.
          branch: "release/v${{ steps.bump.outputs.version }}"
          base: "main"
          delete-branch: true

      - name: Push release tag
        if: steps.cpr.outputs.pull-request-number != ''
        run: git push origin "v${{ steps.bump.outputs.version }}"
