name: Update Adyen Specs

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch: # Manual trigger

concurrency:
  group: update-specs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check.outputs.changes }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: priv/ADYEN_OPENAPI_SHA
          sparse-checkout-cone-mode: false

      - name: Compare tracked SHA against adyen-openapi HEAD
        id: check
        run: |
          OLD_SHA=$(cat priv/ADYEN_OPENAPI_SHA 2>/dev/null || echo "")
          NEW_SHA=$(git ls-remote https://github.com/Adyen/adyen-openapi HEAD | cut -f1)

          echo "sha=$NEW_SHA" >> $GITHUB_OUTPUT
          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

  update:
    needs: check
    if: needs.check.outputs.changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # gh label create
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync specs into repo
        run: |
          git clone --depth 1 https://github.com/Adyen/adyen-openapi /tmp/adyen-openapi
          rsync -a --delete --exclude='.git' --exclude='yaml' /tmp/adyen-openapi/ priv/specs/
          echo "${{ needs.check.outputs.sha }}" > priv/ADYEN_OPENAPI_SHA

      # Diff our own working tree instead of upstream history: no deep clone,
      # and it also catches drift where priv/specs fell out of sync with the SHA.
      - name: Collect changed services
        id: services
        run: |
          SERVICES=$(git status --porcelain -uall -- priv/specs/json \
            | grep -v '^ *D' \
            | sed -E 's|^...||; s|.*/||; s|\.json$||; s|-v([0-9]+)$|:v\1|' \
            | tr '\n' ' ')
          echo "list=$SERVICES" >> $GITHUB_OUTPUT

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}

      - name: Install Dependencies
        run: mix deps.get

      - name: Regenerate APIs
        if: steps.services.outputs.list != ''
        env:
          SERVICES: ${{ steps.services.outputs.list }}
        run: mix adyen.gen $SERVICES

      # Classify against the generated client surface rather than the specs:
      # this is what consumers actually compile against.
      - name: Classify API surface change
        id: surface
        run: |
          mkdir -p /tmp/before
          git archive HEAD generated_lib | tar -x -C /tmp/before

          surface() {
            find "$1" -name '*.ex' -print0 2>/dev/null \
              | xargs -0 -r awk -f scripts/api_surface.awk \
              | LC_ALL=C sort -u
          }
          surface /tmp/before/generated_lib > /tmp/surface_before
          surface generated_lib > /tmp/surface_after

          LC_ALL=C comm -23 /tmp/surface_before /tmp/surface_after > /tmp/removed
          REMOVED=$(wc -l < /tmp/removed | tr -d ' ')
          ADDED=$(LC_ALL=C comm -13 /tmp/surface_before /tmp/surface_after | wc -l | tr -d ' ')

          # Major is deliberately never automatic. Adyen edits already-published
          # API versions in place, and because the version sits in the module path
          # (AdyenEx.Checkout.V68), a removal there cannot affect a consumer on a
          # different version - and one pinned to it can stay on the previous tag.
          # So removals get flagged for review rather than spending the major slot,
          # which belongs to changes in this library's own contract.
          if [ "$REMOVED" -gt 0 ] || [ "$ADDED" -gt 0 ]; then
            BUMP=minor; TYPE='feat(api)'
          else
            BUMP=patch; TYPE='fix(api)'
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "removed=$REMOVED" >> $GITHUB_OUTPUT
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          {
            echo "### API surface: \`$BUMP\` (added $ADDED, removed $REMOVED)"
            if [ "$REMOVED" -gt 0 ]; then
              echo "Removed elements need a human call on whether this warrants a major bump:"
              echo '```'
              head -20 /tmp/removed
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Spec Updates
        run: |
          git add priv/specs priv/ADYEN_OPENAPI_SHA generated_lib
          git diff --cached --quiet && exit 0
          if [ "$REMOVED" -gt 0 ]; then
            git commit -m "$TYPE: update adyen specs and regenerate code" \
              -m "Removes $REMOVED API surface elements from already-published Adyen versions."
          else
            git commit -m "$TYPE: update adyen specs and regenerate code"
          fi
        env:
          TYPE: ${{ steps.surface.outputs.type }}
          REMOVED: ${{ steps.surface.outputs.removed }}

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ steps.surface.outputs.bump }}
        run: |
          CURRENT=$(elixir scripts/bump_version.exs --current)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            *)     NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "Current: $CURRENT, $BUMP bump -> $NEXT"
          echo "version=$(elixir scripts/bump_version.exs "$NEXT")" >> $GITHUB_OUTPUT

      - name: Commit Release
        run: |
          git add mix.exs
          git diff --cached --quiet \
            || git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }}"

      - name: Build PR body
        env:
          BUMP: ${{ steps.surface.outputs.bump }}
          ADDED: ${{ steps.surface.outputs.added }}
          REMOVED: ${{ steps.surface.outputs.removed }}
        run: |
          {
            echo "Automated update of the Adyen OpenAPI specifications."
            echo
            echo "- Synced \`priv/specs/\` with the latest adyen-openapi commit."
            echo "- Updated \`priv/ADYEN_OPENAPI_SHA\` to track the synced commit."
            echo "- Regenerated changed API clients in \`generated_lib/\` via \`mix adyen.gen\`."
            echo "- Bumped \`mix.exs\` (\`$BUMP\`): $ADDED surface elements added, $REMOVED removed."
            echo

            if [ "$REMOVED" -gt 0 ]; then
              echo "## :warning: $REMOVED API surface elements removed"
              echo
              echo "Adyen changed API versions that were already published, so this is"
              echo "breaking for anyone pinned to the affected version namespaces."
              echo "The bump stays \`$BUMP\` because the major slot tracks this library's"
              echo "own contract, not upstream spec churn - **if these removals warrant a"
              echo "major, edit \`@version\` in \`mix.exs\` on this branch before merging.**"
              echo
              echo "<details><summary>Removed elements (first 50)</summary>"
              echo
              echo '```'
              head -50 /tmp/removed
              echo '```'
              echo
              echo "</details>"
            fi
          } > /tmp/pr_body.md

      - name: Ensure removal label exists
        if: steps.surface.outputs.removed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create api-removal \
            --color B60205 \
            --description "Upstream removed elements from a published API version" \
            --force

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore: update adyen specs (v${{ steps.bump.outputs.version }})"
          body-path: /tmp/pr_body.md
          labels: ${{ steps.surface.outputs.removed != '0' && 'api-removal' || '' }}
          branch: "release/v${{ steps.bump.outputs.version }}"
          base: "main"
          delete-branch: true
