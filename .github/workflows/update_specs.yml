name: Update Adyen Specs

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch: # Manual trigger

concurrency:
  group: update-specs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check.outputs.changes }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: priv/ADYEN_OPENAPI_SHA
          sparse-checkout-cone-mode: false

      - name: Compare tracked SHA against adyen-openapi HEAD
        id: check
        run: |
          OLD_SHA=$(cat priv/ADYEN_OPENAPI_SHA 2>/dev/null || echo "")
          NEW_SHA=$(git ls-remote https://github.com/Adyen/adyen-openapi HEAD | cut -f1)

          echo "sha=$NEW_SHA" >> $GITHUB_OUTPUT
          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

  update:
    needs: check
    if: needs.check.outputs.changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync specs into repo
        run: |
          git clone --depth 1 https://github.com/Adyen/adyen-openapi /tmp/adyen-openapi
          rsync -a --delete --exclude='.git' --exclude='yaml' /tmp/adyen-openapi/ priv/specs/
          echo "${{ needs.check.outputs.sha }}" > priv/ADYEN_OPENAPI_SHA

      # Diff our own working tree instead of upstream history: no deep clone,
      # and it also catches drift where priv/specs fell out of sync with the SHA.
      - name: Collect changed services
        id: services
        run: |
          SERVICES=$(git status --porcelain -uall -- priv/specs/json \
            | grep -v '^ *D' \
            | sed -E 's|^...||; s|.*/||; s|\.json$||; s|-v([0-9]+)$|:v\1|' \
            | tr '\n' ' ')
          echo "list=$SERVICES" >> $GITHUB_OUTPUT

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}

      - name: Install Dependencies
        run: mix deps.get

      - name: Regenerate APIs
        if: steps.services.outputs.list != ''
        env:
          SERVICES: ${{ steps.services.outputs.list }}
        run: mix adyen.gen $SERVICES

      # Classify against the generated client surface rather than the specs:
      # this is what consumers actually compile against.
      - name: Classify API surface change
        id: surface
        run: |
          mkdir -p /tmp/before
          git archive HEAD generated_lib | tar -x -C /tmp/before

          surface() {
            find "$1" -name '*.ex' -print0 2>/dev/null \
              | xargs -0 -r awk -f scripts/api_surface.awk \
              | LC_ALL=C sort -u
          }
          surface /tmp/before/generated_lib > /tmp/surface_before
          surface generated_lib > /tmp/surface_after

          REMOVED=$(LC_ALL=C comm -23 /tmp/surface_before /tmp/surface_after | wc -l)
          ADDED=$(LC_ALL=C comm -13 /tmp/surface_before /tmp/surface_after | wc -l)

          if [ "$REMOVED" -gt 0 ]; then
            BUMP=major; TYPE='feat(api)!'
          elif [ "$ADDED" -gt 0 ]; then
            BUMP=minor; TYPE='feat(api)'
          else
            BUMP=patch; TYPE='fix(api)'
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          {
            echo "### API surface: \`$BUMP\`"
            echo "- removed: $REMOVED"
            echo "- added: $ADDED"
            LC_ALL=C comm -23 /tmp/surface_before /tmp/surface_after | head -20
          } >> $GITHUB_STEP_SUMMARY

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Spec Updates
        run: |
          git add priv/specs priv/ADYEN_OPENAPI_SHA generated_lib
          git diff --cached --quiet \
            || git commit -m "$TYPE: update adyen specs and regenerate code"
        env:
          TYPE: ${{ steps.surface.outputs.type }}

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ steps.surface.outputs.bump }}
        run: |
          CURRENT=$(elixir scripts/bump_version.exs --current)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            *)     NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "Current: $CURRENT, $BUMP bump -> $NEXT"
          echo "version=$(elixir scripts/bump_version.exs "$NEXT")" >> $GITHUB_OUTPUT

      - name: Commit Release
        run: |
          git add mix.exs
          git diff --cached --quiet \
            || git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }}"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore: update adyen specs (v${{ steps.bump.outputs.version }})"
          body: |
            This is an automated PR to update Adyen OpenAPI specifications.

            Changes:
            - Synced `priv/specs/` with the latest adyen-openapi commit.
            - Updated `priv/ADYEN_OPENAPI_SHA` to track the synced commit.
            - Regenerated changed API clients in `generated_lib/` via `mix adyen.gen`.
            - Bumped version in `mix.exs` (`${{ steps.surface.outputs.bump }}`), classified
              from the generated client surface: struct fields and function heads
              removed count as breaking, added-only counts as a feature.
          branch: "release/v${{ steps.bump.outputs.version }}"
          base: "main"
          delete-branch: true
